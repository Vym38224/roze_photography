    <!-- 3. Hlavní CSS styly -->
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Playfair Display", serif;
            font-weight: 600;
            line-height: 1.5;
            position: relative;
            overflow: hidden;
            overflow-y: auto;
        }

        html,
        body {
            overflow-x: hidden;
            /* Zakáže jakékoliv posouvání do stran */
            max-width: 100%;
        }

        :root {
            --text-color-primary: #131312;
            --text-color-secondary: #1d3a5a;
            --bg-color-primary: #F2F2F2;
            --bg-color-secondary: #F7FAFC;
            --bg-color-tertiary: #1d3a5a;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* Montserrat in CSS */
        .text-mont-300 {
            font-family: "Montserrat", sans-serif;
            font-weight: 300
        }

        .text-mont-400 {
            font-family: "Montserrat", sans-serif;
            font-weight: 400
        }

        .text-mont-700 {
            font-family: "Montserrat", sans-serif;
            font-weight: 700
        }

        .text-mont-900 {
            font-family: "Montserrat", sans-serif;
            font-weight: 900
        }



        /* Colors */
        .primary-text-color {
            color: var(--text-color-primary);
        }

        .secondary-text-color {
            color: var(--text-color-secondary);
        }

        .background__color--primary {
            background-color: var(--bg-color-primary);
        }

        .background__color--secondary {
            background-color: var(--bg-color-secondary);
        }

        .background__color--tertiary {
            background-color: var(--bg-color-tertiary)
        }


        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            max-width: 100vw;
            background-color: rgba(255, 255, 255, 0);
            z-index: 1000;
            height: 70px;
            transition: background-color 0.25s ease;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: 25px;
            font-weight: 400;
            line-height: 100%;
            letter-spacing: 0;
        }

        h1:hover {
            opacity: 70%
        }

        header.header--scrolled {
            background-color: var(--bg-color-primary)
        }

        section,
        .error-page {
            padding-top: 6em;
            padding-bottom: 4em;
        }

        main.error-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }


        .home {
            background-image: url('assets/pictures/uvodni/uvodka.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: scroll;
            height: 95vh;
        }

        .portfolio {
            background-image: url('assets/pictures/uvodni/uvodka_portfolio.webp');
            background-size: cover;
            background-position: 0 73%;
            background-repeat: no-repeat;
            background-attachment: scroll;
            height: 95vh;
        }

        .portfolio-divider-scnd {
            background-image: url('assets/pictures/prechody/psi_26.jpg')
        }

        @media (max-width:720px) {
            .portfolio-divider-scnd {
                background-image: url('assets/pictures/prechody/psi_27.jpg');
            }
        }

        @keyframes hero-title-rise {
            from {
                opacity: 0;
                transform: translateY(2.5rem);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .section__title,
            .faq__item,
            .contact-form-panel {
                opacity: 1;
                transform: none;
                animation: none;
            }
        }

        h2 {
            font-weight: 600;
            color: var(--text-color-primary);
            font-size: 1.75em;
            margin-top: 0.5em;
            margin-bottom: 0em;
            padding-left: 1em;
        }

        h3 h4 {
            font-weight: 600;
        }


        .introduction {
            margin-bottom: -1em;
        }

        .section__title {
            width: fit-content;
            display: block;
            margin: 0 auto;
            text-align: center;
            z-index: 1;
            position: relative;
            font-size: 40px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(2.5rem);
            will-change: transform, opacity;
            padding: 0;
            padding-bottom: 1em;
        }

        .section__title.is-visible {
            animation: hero-title-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .subtitle {
            font-weight: 600;
            font-size: 2em;
            color: var(--text-color-secondary);
            margin-top: -1em;
        }

        #portfolio,
        #o_mne,
        #kontakty {
            background-color: var(--bg-color-primary);
        }

        #nabidka,
        #otazky {
            background-color: var(--bg-color-secondary);
            position: relative;
            z-index: 2;
        }

        #nabidka p a {
            display: inline-block;
            position: relative;
            z-index: 3;
            cursor: pointer;
            padding: 0 0.05em;
        }

        .faq {
            display: grid;
            gap: 1rem;
        }

        .faq__item {
            border: 1px solid #d8d8d8;
            border-radius: 0.9rem;
            background: #ffffff;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(11, 11, 21, 0.04);
            opacity: 0;
            transform: translateY(2.5rem);
            will-change: transform, opacity;
        }

        .faq__item.is-visible {
            animation: hero-title-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        .faq__description {
            opacity: 0;
            transform: translateY(2.5rem);
            will-change: transform, opacity;
        }

        .faq__description.is-visible {
            opacity: 1;
            transform: translateY(0);
            transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s, opacity 0.9s ease 0.15s;
        }

        .faq__question {
            list-style: none;
            padding: 1.1rem 1.25rem;
            font-weight: 400;
            color: var(--text-color-primary);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            position: relative;
        }

        .faq__question::-webkit-details-marker {
            display: none;
        }

        .faq__question::after {
            content: "▸";
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            flex-shrink: 0;
            font-size: 1.2em;
            line-height: 1;
            color: var(--text-color-secondary);
            transition: transform 0.2s ease;
        }

        #otazky .faq__question {
            cursor: pointer;
            justify-content: space-between;
        }

        #otazky details[open]>.faq__question::after {
            transform: rotate(90deg);
        }

        #nabidka .faq__item .faq__question::after {
            content: none;
            display: none;
        }

        .faq__answer {
            padding: 0 1.25rem 1.25rem;
            color: var(--text-color-secondary);
        }

        .nabidka__cards {
            display: flex;
            flex-direction: row;
            gap: 0;
            width: 100%;
        }


        .package.is-visible {
            animation: package-card-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes package-card-rise {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .package--left.is-visible {
            animation: package-card-left 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .package--right.is-visible {
            animation: package-card-right 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes package-card-left {
            from {
                opacity: 0;
                transform: translateX(-8em);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes package-card-right {
            from {
                opacity: 0;
                transform: translateX(8em);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .contact-form-panel {
            opacity: 0;
            transform: translateX(4rem);
            will-change: transform, opacity;
        }

        .contact-form-panel.is-visible {
            animation: contact-form-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        @keyframes contact-form-rise {
            from {
                opacity: 0;
                transform: translateX(4rem);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .portfolio-divider {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 50vh;
            min-height: 50vh;
            overflow: hidden;
            position: relative;
            background-color: var(--bg-color-secondary);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center 49%;
            background-attachment: fixed;
            z-index: 0;
        }

        .portfolio-divider__image {
            display: none;
        }

        @media (max-width: 960px) {
            .portfolio-divider {
                height: 35vh;
                min-height: 35vh;
                background-position: center 20%
            }
        }

        @media (max-width: 560px) {
            .first {
                height: 26vh;
                min-height: 26vh;
                background-position: 59% 30%;
            }

            .scnd {
                height: 26vh;
                min-height: 26vh;
                background-position: 58% center;
            }

            .port {
                height: 26vh;
                min-height: 26vh;
                background-position: 53% 50%;
            }
        }

        /* flex */
        .flex {
            display: flex
        }

        .flex__item--left {
            flex: 2;
        }

        .flex__item--right {
            flex: 1;
        }

        .flex__item {
            border: 1px;
            text-align: left;
            border-radius: 0.9em;
            margin-right: 1em;
            flex: 1;
            overflow: hidden;
        }

        .flex__item:last-child {
            margin-right: 0em;
        }

        .inside_flex__item {
            flex-direction: column;
            text-align: center;
            padding: 2em;
            margin: auto;
            margin-bottom: 1em;
            align-items: center;
            margin-right: 1em;
        }

        .inside_flex__item:last-child {
            margin-right: 0em;
        }

        .flex_column {
            flex-direction: column;
        }

        .flex__item--spaces {
            padding-left: 2em;
            margin-bottom: 1em;
            margin-right: 0em;
        }

        .flex__item--spaces:last-child {
            margin-bottom: 0em;
        }

        .inside_flex__item--A {
            flex: 1.5;
            padding-top: 2em;
        }

        .inside_flex__item--B {
            flex: 4;
            padding-bottom: 1em;
            padding-left: 2em;
            border-left: 1px solid #eeeeee;
        }

        .flex__half {
            flex: 0 0 50%;
            box-sizing: border-box;
        }

        .flex__half h3 {
            margin-top: 0;
            padding-top: 0
        }

        .package--middle {
            box-shadow: 0 18px 40px rgba(11, 11, 21, 0.06);
            z-index: 1;
        }

        .nabidka__cards .package--left,
        .nabidka__cards .package--right {
            transform: translateX(0);
            align-self: center;
        }

        .flex__touch {
            display: flex;
            flex-direction: column;
            font-size: 18px;
        }

        .flex__touch--item {
            display: inline-flex;
            align-items: center;
            gap: 0.5em;
            padding-top: 0.6em;
            width: auto;
            max-width: min-content;
        }

        .flex__touch--item-marker {
            padding-left: 3px;
        }

        .flex__touch--item-mobile {
            padding-left: 5px;
        }

        .flex__touch--sup {
            margin-left: -4px
        }

        .flex__touch--right {
            text-decoration: none;
            color: var(--text-color-secondary);
            padding-left: -0.5em;
        }

        s .flex__touch--item img {
            display: inline-block;
            vertical-align: middle;
        }

        /* grid */
        .grid {
            display: grid;
        }

        .grid__horizontal {
            grid-template-columns: 1fr 2.5fr;
            grid-template-areas:
                "A B";
            margin-top: 4vw;
        }

        .grid__horizontal--item-A {
            grid-area: A;
        }

        .grid__horizontal--item-B {
            grid-area: B;
        }

        .introductory-photo {
            width: auto;
        }

        .o_mne {
            width: 21em;
            opacity: 0;
            border-radius: 0.9rem;
            transform: translateX(5rem);
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.8s ease;
        }

        .o_mne.is-visible {
            opacity: 1;
            transform: translateX(0);
        }

        .menu {
            display: flex;
            flex-direction: row-reverse;
            margin-top: 0.3em;
            margin-right: 3em;
        }

        .menu__item {
            padding: 1em 0.75em;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
        }

        .menu__item:first-child {
            padding-right: 0;
        }

        .menu__item:hover {
            opacity: 0.65;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;

        }

        .hamburger,
        .hamburger::before,
        .hamburger::after {
            display: block;
            width: 25px;
            height: 2.9px;
            background-color: var(--text-color-primary);
            transition: transform 0.3s, opacity 0.3s;
            position: relative;
            padding: 12px 0;
            background-clip: content-box;
            box-sizing: content-box;
        }

        .hamburger::before,
        .hamburger::after {
            content: '';
            position: absolute;
            left: 0;
        }

        .hamburger::before {
            top: -8px;
        }

        .hamburger::after {
            top: 8px;
        }

        @media (max-width: 960px) {
            .menu-toggle {
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0 auto;
                padding: 5em;
            }

            .menu {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: var(--bg-color-primary);
                margin: 0;
                padding: 1em 0;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
            }

            .menu.is-active {
                display: flex;
            }

            .menu__item {
                padding: 0.75em 1.5em;
            }

            .menu__item:first-child {
                padding-right: 1.5em;
            }

            .menu-toggle.is-active .hamburger {
                background-color: transparent;
            }

            .menu-toggle.is-active .hamburger::before {
                transform: rotate(45deg);
                top: 0;
            }

            .menu-toggle.is-active .hamburger::after {
                transform: rotate(-45deg);
                top: 0;
            }
        }

        /* social icons */
        .social {
            display: flex;

        }

        .social__item {

        .social__item img {

        .social__item:hover img,

        }

        header.flex {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header .container {
            display: flex;
            align-items: center;

        }


        .flex__item--left {
            display: flex;
            align-items: center
        }

        .flex__item--right {

        }

        }

        }

        .package {
            padding: 1.5rem 2rem 2rem;
            margin: 0;
            box-sizing: border-box;
            border: 1px solid rgba(29, 42, 77, 0.08);
            border-radius: 0.9rem;
            background: #ffffff;
            min-height: 420px;
            flex: 1 1 0;
            width: 100%;
            max-width: none;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            transform-origin: center center;
            will-change: transform, box-shadow;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            box-shadow: none;
        }

        .package:hover {
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-radius 0.25s ease;
        }

        .nabidka__cards .package--right,
        .nabidka__cards .package--middle {

            min-width: 0;
            max-width: none;
            transform: translateY(0);
        }

        .nabidka__cards .package--left {
            border-top-right-radius: 0;

        }

        .nabidka__cards .package--right {

        .nabidka__cards .package:hover,
